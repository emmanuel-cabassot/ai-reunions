version: '3.8'

services:
  # Service principal : API de transcription audio avec WhisperX
  whisper-api:
    build:
      context: .
      dockerfile: Dockerfile

    # Nom du conteneur
    container_name: whisper-api

    # ====== SUPPORT GPU NVIDIA ======
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [ gpu ]

    # ====== MÉMOIRE PARTAGÉE ======
    shm_size: '2gb'

    # ====== PORTS ======
    ports:
      - "8001:8000"

    # ====== VOLUMES ======
    volumes:
      - .:/app
      - pip-cache:/root/.cache/pip
      - ./transcriptions:/app/transcriptions
      # Cache Hugging Face pour les modèles pyannote
      - hf-cache:/root/.cache/huggingface

    # ====== VARIABLES D'ENVIRONNEMENT ======
    environment:
      - PYTHONUNBUFFERED=1
      # Modèle Whisper à utiliser (tiny, base, small, medium, large-v3)
      - WHISPER_MODEL=medium
      # Token Hugging Face pour pyannote (OBLIGATOIRE pour la diarisation)
      # Obtenez-le sur https://huggingface.co/settings/tokens
      # et acceptez les conditions sur https://huggingface.co/pyannote/speaker-diarization-3.1
      - HF_TOKEN=${HF_TOKEN}
      # Niveau de log
      - LOG_LEVEL=INFO

    # ====== COMMANDE ======
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload

    # Redémarre automatiquement en cas de crash
    restart: unless-stopped

# Volumes persistants
volumes:
  pip-cache:
  hf-cache:
